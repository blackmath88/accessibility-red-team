schema: art/research-pilot-cohort/v1
id: ch.zh-so.pilot-v1
as_of: 2026-09-29
purpose: >
  Stratified research pilot for evaluating observatory accuracy, actionability,
  operational robustness, and bounded Morrow added value across heterogeneous
  municipal digital services. Not a municipality ranking or conformance study.

sampling:
  cantons: [ZH, SO]
  target_per_canton: 12
  dimensions:
    - municipality_scale
    - urbanity_and_regional_role
    - civic_service_complexity
    - observed_web_implementation
  notes:
    - Technology/provider classification is observational and must be verified from captured evidence.
    - Selection intentionally includes very small municipalities and major cities.
    - Canonical URLs below were verified reachable during pilot research on 2026-09-29.

sites:
