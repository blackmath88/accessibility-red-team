name: control-center

on:
  pull_request:
    paths:
      - "control-center/**"
  push:
    branches: [main]
    paths:
      - "control-center/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
