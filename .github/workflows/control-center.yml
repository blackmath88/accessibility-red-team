name: control-center

on:
  pull_request:
    paths:
      - "control-center/**"
  push:
    branches: [main]
    paths:
      - "control-center/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('control-center/data/organizations.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('control-center/data/probes.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('control-center/schema/organization.schema.json','utf8'))"
      - name: Check control center entrypoint
        run: test -f control-center/index.html
