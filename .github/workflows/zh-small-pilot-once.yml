name: zh-small-pilot-once
# optimized rerun

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zh-small-pilot-once.yml

jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run cohort -- cohorts/zh-small-pilot.yml --out runs/cohorts/zh-small-pilot
      - uses: actions/upload-artifact@v4
        with:
          name: zh-small-pilot
          path: runs/cohorts/zh-small-pilot
