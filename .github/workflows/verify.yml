name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npm run check

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run scan -- https://example.com --out runs/smoke
      - run: npm run scout -- https://example.com --out runs/scout/surface.json --max-pages 3 --max-depth 1
      - run: npm run report -- runs/smoke --profile requirements/profiles/ch.federal.yml
      - run: test -f runs/smoke/manifest.json && test -f runs/smoke/probe-results.json && test -f runs/smoke/summary.json && test -f runs/smoke/report.json && test -f runs/smoke/report.html && test -f runs/scout/surface.json
