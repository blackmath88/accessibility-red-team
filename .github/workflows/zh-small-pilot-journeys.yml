name: zh-small-pilot-journeys

on:
  workflow_dispatch:

jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run cohort -- cohorts/zh-small-pilot-journeys.yml --out runs/cohorts/zh-small-pilot-journeys
      - uses: actions/upload-artifact@v4
        with:
          name: zh-small-pilot-journeys
          path: runs/cohorts/zh-small-pilot-journeys
