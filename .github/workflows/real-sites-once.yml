name: real-sites-once
# rerun after classifier hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/real-sites-once.yml

jobs:
  scout-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:scout
      - uses: actions/upload-artifact@v4
        with:
          name: scout-corpus-once
          path: runs/benchmark-scout
