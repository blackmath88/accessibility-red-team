name: Observstory field evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 0"

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: observstory-field-eval
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build fresh Observstory snapshot
        id: observstory
        uses: blackmath88/observstory@main
        with:
          config: observstory.config.json
          coordination: .observstory/coordination.json
          output: observstory

      - name: Evaluate field behavior
        run: |
          python3 scripts/eval_observstory.py \
            --snapshot observstory/data/snapshot.json \
            --config .observstory/eval.json \
            --out observstory-eval

      - name: Add evaluation to job summary
        if: always()
        run: |
          if [ -f observstory-eval/report.md ]; then
            cat observstory-eval/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observstory-field-eval
          path: |
            observstory
            observstory-eval
          retention-days: 30
