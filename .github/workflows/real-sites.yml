name: real-sites-scout

on:
  workflow_dispatch:

jobs:
  scout-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:scout
      - uses: actions/upload-artifact@v4
        with:
          name: scout-corpus
          path: runs/benchmark-scout
