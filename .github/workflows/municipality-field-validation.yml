name: municipality-field-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "field-validation/basel-region.yml"
      - ".github/workflows/municipality-field-validation.yml"

jobs:
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ch-bs-riehen
            url: https://www.riehen.ch/
          - id: ch-bl-allschwil
            url: https://www.allschwil.ch/
          - id: ch-bl-binningen
            url: https://www.binningen.ch/
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Deterministic scan
        run: npm run scan -- "${{ matrix.url }}" --out "runs/field/${{ matrix.id }}/scan"
      - name: Safe journeys
        run: npm run journey -- "${{ matrix.url }}" --out "runs/field/${{ matrix.id }}/journey"
      - name: Summarize field evidence
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const id = process.env.SITE_ID;
          const base = `runs/field/${id}`;
          const summary = JSON.parse(fs.readFileSync(`${base}/scan/summary.json`, 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(`${base}/scan/coverage.json`, 'utf8'));
          const journeys = JSON.parse(fs.readFileSync(`${base}/journey/journey-results.json`, 'utf8'));
          const out = {
            schema: 'art/field-validation-summary/v1',
            siteId: id,
            scan: summary,
            coverageEngine: coverage.engine,
            journeys: journeys.results.map(r => ({
              journeyId: r.journeyId,
              kind: r.kind,
              outcome: r.outcome,
              evidenceCount: r.evidence.length,
              summary: r.summary
            }))
          };
          fs.writeFileSync(`${base}/field-summary.json`, JSON.stringify(out, null, 2));
          console.log(JSON.stringify(out, null, 2));
          NODE
        env:
          SITE_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: field-${{ matrix.id }}
          path: runs/field/${{ matrix.id }}
          retention-days: 14
