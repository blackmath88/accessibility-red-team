<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Accessibility Red Team: observations, evidence and review</title><desc id="desc">Scoped discovery and probes produce evidence. Reports and recorded replays preserve distinctions and support human review.</desc>
<rect width="1200" height="480" rx="12" fill="#f4f5f1"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#17272b">
<text x="44" y="48" font-size="15" letter-spacing="3">ACCESSIBILITY RED TEAM</text>
<text x="44" y="96" font-size="32" font-weight="700">Make the finding inspectable.</text>
<g stroke="#c6d2ce" fill="#fff"><rect x="44" y="150" width="300" height="240" rx="10"/><rect x="408" y="150" width="348" height="240" rx="10"/><rect x="820" y="150" width="336" height="240" rx="10"/></g>
<path d="M344 270H398M756 270H810" stroke="#395d9a" stroke-width="3"/><path d="m389 263 9 7-9 7m412-14 9 7-9 7" fill="none" stroke="#395d9a" stroke-width="3"/>
<text x="68" y="187" font-size="13" fill="#395d9a" letter-spacing="2">01 / OBSERVE</text>
<text x="68" y="230" font-size="21">Scoped discovery</text><text x="68" y="269" font-size="21">Deterministic probes</text><text x="68" y="308" font-size="21">Bounded journeys</text><text x="68" y="347" font-size="21">Recorded run events</text>
<text x="432" y="187" font-size="13" fill="#395d9a" letter-spacing="2">02 / KEEP THE EVIDENCE</text><text x="432" y="232" font-size="25" font-weight="700">Evidence + coverage</text><text x="432" y="261" font-size="17">Observed / incomplete / unknown</text><path d="M432 282H730" stroke="#dce3df"/><text x="432" y="318" font-size="25" font-weight="700">Explicit interpretation</text><text x="432" y="348" font-size="17">Profile, method + limitations</text>
<text x="844" y="187" font-size="13" fill="#395d9a" letter-spacing="2">03 / REVIEW</text><text x="844" y="230" font-size="21">Traceable reports</text><text x="844" y="269" font-size="21">Change comparisons</text><text x="844" y="308" font-size="21">Run Theatre replay</text><text x="844" y="347" font-size="21">Human investigation</text>
<text x="44" y="440" font-size="17" fill="#536863">Automated observations support review. They do not certify conformance.</text></g></svg>